<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Investment Committee Simulation roadmap</title>
  <desc id="desc">Three phases from mandate to portfolio selection and stress testing to final presentation and compact defense, with five distinct committee roles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4fbfd"/><stop offset="1" stop-color="#fff8ee"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071626" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#0b1f35">Investment Committee Simulation</text>
  <text x="70" y="116" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4b6073">A three-gate roadmap from client mandate to focused portfolio to committee defense</text>

  <g filter="url(#shadow)">
    <rect x="65" y="155" width="460" height="500" rx="24" fill="#ffffff"/>
    <rect x="65" y="155" width="460" height="72" rx="24" fill="#1f7a78"/>
    <rect x="570" y="155" width="460" height="500" rx="24" fill="#ffffff"/>
    <rect x="570" y="155" width="460" height="72" rx="24" fill="#c96f4f"/>
    <rect x="1075" y="155" width="460" height="500" rx="24" fill="#ffffff"/>
    <rect x="1075" y="155" width="460" height="72" rx="24" fill="#765b9b"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="95" y="202" font-size="27" font-weight="700" fill="#ffffff">PHASE 1 · FRAME THE MANDATE</text>
    <text x="600" y="202" font-size="27" font-weight="700" fill="#ffffff">PHASE 2 · BUILD &amp; CHALLENGE</text>
    <text x="1105" y="202" font-size="27" font-weight="700" fill="#ffffff">PHASE 3 · DEFEND</text>

    <g fill="#0b1f35" font-size="22" font-weight="700">
      <text x="100" y="270">1 · Establish the market view</text><text x="100" y="350">2 · Discover client needs</text><text x="100" y="430">3 · Set measurable guardrails</text><text x="100" y="510">4 · Vote at Gate 1</text>
      <text x="605" y="270">1 · Translate mandate to candidates</text><text x="605" y="350">2 · Select 8–10 holdings</text><text x="605" y="430">3 · Integrate weights and trade-offs</text><text x="605" y="510">4 · Stress, correct, and re-test</text><text x="605" y="590">5 · Conclude hedge or no hedge</text>
      <text x="1110" y="270">1 · Issue the recommendation</text><text x="1110" y="350">2 · Build the evidence package</text><text x="1110" y="430">3 · Deliver the presentation</text><text x="1110" y="510">4 · Run the compact defense</text>
    </g>
    <g fill="#4b6073" font-size="18">
      <text x="100" y="298">Human-first macro evidence and scenarios</text><text x="100" y="378">Goals, constraints, risk, and unknowns</text><text x="100" y="458">Return, liquidity, risk, and drawdown limits</text><text x="100" y="538">Five members approve or require revision</text>
      <text x="605" y="298">Funds and ETFs are the primary vehicles</text><text x="605" y="378">Never more than 10; do not fill every slot</text><text x="605" y="458">Resolve overlap, concentration, and fit</text><text x="605" y="538">Test the IPS and client consequence</text><text x="605" y="618">At most one targeted derivative hedge</text>
      <text x="1110" y="298">One evidence-linked client decision</text><text x="1110" y="378">Trace mandate, holdings, weights, and risk</text><text x="1110" y="458">Balanced role ownership and clear exhibits</text><text x="1110" y="538">Targeted questions for all five roles</text>
    </g>

    <g font-size="17" font-weight="700">
      <rect x="95" y="578" width="390" height="48" rx="24" fill="#e2f3ef"/><text x="132" y="609" fill="#17623e">GATE 1 · APPROVE THE MANDATE</text>
      <rect x="600" y="578" width="400" height="48" rx="24" fill="#fff0e8" opacity="0"/>
      <rect x="1105" y="578" width="400" height="48" rx="24" fill="#f0e9f8"/><text x="1155" y="609" fill="#5a3d7d">GATE 3 · DEFEND THE DECISION</text>
    </g>
  </g>

  <rect x="65" y="700" width="1470" height="130" rx="24" fill="#0b1f35"/>
  <text x="95" y="742" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#edca8a">FIVE DISTINCT DECISION RIGHTS · ONE COLLECTIVE VOTE</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff">
    <text x="95" y="780"><tspan font-weight="700">Client &amp; Macro</tspan><tspan> · mandate and market view</tspan></text>
    <text x="390" y="780"><tspan font-weight="700">Fixed Income</tspan><tspan> · income, duration, credit, rates</tspan></text>
    <text x="760" y="780"><tspan font-weight="700">Equity</tspan><tspan> · equity funds/ETFs and limited stocks</tspan></text>
    <text x="1135" y="780"><tspan font-weight="700">Portfolio Manager</tspan><tspan> · selection, weights, trade-offs</tspan></text>
    <text x="95" y="810"><tspan font-weight="700">Risk &amp; Derivatives</tspan><tspan> · portfolio stress, residual risk, hedge/no hedge</tspan></text>
  </g>
</svg>
